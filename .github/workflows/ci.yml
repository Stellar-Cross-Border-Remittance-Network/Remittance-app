name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Coverage thresholds (80% lines/functions/statements, 70% branches)
      # are enforced in jest.config.js, so this is the coverage gate.
      - name: Tests + coverage gate
        run: npm run test:ci -- --coverage